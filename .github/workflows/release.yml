name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 构建 (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 构建
        run: moon build --target ${{ matrix.target }}

      - name: 打包构建产物
        run: |
          mkdir -p dist
          cp -r target/${{ matrix.target }}/release/* dist/ 2>/dev/null || true
          tar -czf hydro-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: hydro-${{ matrix.target }}
          path: hydro-*.tar.gz

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifacts@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz