name: PR Check

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: 快速检查
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 编译检查
        run: moon check

      - name: 格式化检查
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::代码格式不规范，请运行 moon fmt" && exit 1)

      - name: 快速测试 (wasm-gc)
        run: moon test --target wasm-gc

  native-check:
    name: Native 后端检查
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Native 编译检查
        run: moon check --target native

      - name: Native 测试
        run: moon test --target native
