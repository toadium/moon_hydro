name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: 编译检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon 版本
        run: moon version

      - name: 编译检查
        run: moon check

  test:
    name: 测试 (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 运行测试
        run: moon test --target ${{ matrix.target }}

  fmt:
    name: 格式检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 格式化检查
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::代码格式不规范，请运行 moon fmt" && exit 1)

  run-backend:
    name: 后端可执行验证
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 运行 backend
        run: moon run --target native backend
