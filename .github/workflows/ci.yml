name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 编译检查
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-0.1.20260827-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon 版本
        run: moon version

      - name: 编译检查
        run: moon check

  test:
    name: 测试 (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-0.1.20260827-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 运行测试
        run: moon test --target ${{ matrix.target }}

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: |
            target/
            test_hydro_*.json
          if-no-files-found: ignore

  fmt:
    name: 格式检查
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-0.1.20260827-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 格式化检查
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::代码格式不规范，请运行 moon fmt" && exit 1)

  run-backend:
    name: 后端可执行验证
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 MoonBit 工具链
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ runner.os }}-0.1.20260827-v1

      - name: 安装 MoonBit
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: 运行 backend
        run: moon run --target native backend
